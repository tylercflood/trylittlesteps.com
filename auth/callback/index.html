<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Little Steps</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../../assets/logo-mark.png" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f5;
        --card: #ffffff;
        --ink: #111111;
        --muted: #66615d;
        --line: #e7ded7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      main {
        width: min(100%, 420px);
        display: grid;
        gap: 18px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 22px 60px rgba(17, 17, 17, 0.08);
      }

      img {
        width: 58px;
        height: 58px;
        border-radius: 16px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 32px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      p {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.45;
      }

      a.button {
        min-height: 56px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: var(--ink);
        color: #ffffff;
        font-size: 16px;
        font-weight: 900;
        text-decoration: none;
      }

      .hint {
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../../assets/logo-mark.png" alt="" />
      <h1>Open Little Steps</h1>
      <p id="message">Your email is ready. Open Little Steps to continue.</p>
      <a id="open-app" class="button" href="littlesteps://auth/callback">Open Little Steps</a>
      <p class="hint">If this is your computer, open the email on the phone where you started signup.</p>
    </main>
    <script>
      const callbackPayload = `${window.location.search || ""}${window.location.hash || ""}`;
      const appUrl = `littlesteps://auth/callback${callbackPayload}`;
      const button = document.getElementById("open-app");
      const message = document.getElementById("message");
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));
      const errorDescription = params.get("error_description") || hashParams.get("error_description");
      const type = params.get("type") || hashParams.get("type");

      button.href = appUrl;

      if (errorDescription) {
        message.textContent = errorDescription.replace(/\+/g, " ");
      } else if (type === "recovery") {
        message.textContent = "Open Little Steps to choose a new password.";
      }

      if (/iPhone|iPad|iPod|Android/i.test(window.navigator.userAgent)) {
        window.setTimeout(() => {
          window.location.href = appUrl;
        }, 700);
      }
    </script>
  </body>
</html>
